<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>12:00 AM • For Bubu ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #07040c;
      --bg-mid: #130a20;
      --card-bg: rgba(24, 14, 38, 0.82);
      --card-border: rgba(255, 120, 158, 0.22);
      --accent: #ff4d7d;
      --accent-soft: rgba(255, 77, 125, 0.14);
      --accent-glow: rgba(255, 77, 125, 0.38);
      --gold: #f6c667;
      --gold-soft: rgba(246, 198, 103, 0.12);
      --text-main: #fcf8ff;
      --text-soft: #dcd0ec;
      --text-muted: #9885b2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 0%, #26113b 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow-x: hidden;
      position: relative;
    }

    #starsCanvas, #fxCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #starsCanvas { z-index: 0; }
    #fxCanvas { z-index: 25; }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(85px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.42;
    }
    .orb-1 { width: 280px; height: 280px; background: #ff3b72; top: -70px; right: -60px; }
    .orb-2 { width: 260px; height: 260px; background: #7b2cbf; bottom: -60px; left: -60px; }

    .shell {
      width: 100%;
      max-width: 450px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Main Storybook Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 28px 24px;
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      position: relative;
      overflow: hidden;
    }

    .fade-enter {
      animation: pageTurn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes pageTurn {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Subtle Page Dots */
    .dots-bar {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 20px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.16);
      transition: all 0.35s ease;
    }
    .dot.active {
      width: 24px;
      background: linear-gradient(90deg, #ff4d7d, #f6c667);
    }
    .dot.done {
      background: rgba(255, 77, 125, 0.5);
    }

    /* Dynamic Facial Expression Header */
    .mood-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
    }

    .emoji-avatar {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 77, 125, 0.25), rgba(246, 198, 103, 0.08));
      border: 1px solid rgba(255, 138, 171, 0.35);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      box-shadow: 0 10px 30px rgba(255, 77, 125, 0.2);
      margin-bottom: 8px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    .emoji-pop {
      animation: emojiPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes emojiPop {
      0% { transform: scale(0.6) rotate(-8deg); }
      60% { transform: scale(1.18) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .mood-caption {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid rgba(246, 198, 103, 0.3);
      padding: 4px 12px;
      border-radius: 99px;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 29px;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
      text-align: center;
      margin-bottom: 16px;
    }

    .story-text {
      font-size: 15.2px;
      line-height: 1.74;
      color: var(--text-soft);
      margin-bottom: 18px;
    }

    .story-text p {
      margin-bottom: 13px;
    }
    .story-text p:last-child {
      margin-bottom: 0;
    }

    .story-text strong {
      color: #ffffff;
      font-weight: 600;
    }

    .story-text em {
      color: var(--gold);
      font-style: italic;
    }

    /* Interactive Story Reveal Box */
    .whisper-box {
      margin: 16px 0;
      padding: 15px 16px;
      border-radius: 18px;
      background: rgba(255, 77, 125, 0.1);
      border: 1px solid rgba(255, 77, 125, 0.32);
      font-size: 14.5px;
      line-height: 1.65;
      color: #ffe6ee;
      display: none;
      animation: pageTurn 0.35s ease;
    }

    .whisper-box.gold {
      background: rgba(246, 198, 103, 0.1);
      border-color: rgba(246, 198, 103, 0.38);
      color: #fff3d9;
    }

    /* Reaction Chips & Buttons */
    .reaction-group {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 8px;
    }

    .react-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-family: inherit;
      font-size: 14.2px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .react-btn:hover {
      background: rgba(255, 77, 125, 0.12);
      border-color: rgba(255, 77, 125, 0.45);
    }

    .react-btn.selected {
      background: rgba(246, 198, 103, 0.14);
      border-color: var(--gold);
      color: #fff;
    }

    .next-btn {
      width: 100%;
      padding: 15px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 190, 205, 0.35);
      background: linear-gradient(135deg, #ff4d7d 0%, #d92b60 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 10px 26px var(--accent-glow);
      margin-top: 14px;
      transition: all 0.22s ease;
    }

    .next-btn:active {
      transform: scale(0.985);
    }

    /* Polaroid Memory Tap Cards */
    .moment-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }

    .moment-item {
      border-radius: 16px;
      padding: 13px 15px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .moment-item.opened {
      background: rgba(246, 198, 103, 0.09);
      border-color: rgba(246, 198, 103, 0.42);
    }

    .moment-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .moment-body {
      font-size: 13.8px;
      line-height: 1.6;
      color: var(--text-soft);
      margin-top: 8px;
      display: none;
    }

    .moment-item.opened .moment-body {
      display: block;
      animation: pageTurn 0.3s ease;
    }

    /* Final Letter Box */
    .letter-container {
      background: linear-gradient(180deg, rgba(16, 9, 28, 0.88) 0%, rgba(28, 14, 45, 0.92) 100%);
      border: 1px solid rgba(246, 198, 103, 0.38);
      border-radius: 22px;
      padding: 22px 18px;
      max-height: 60vh;
      overflow-y: auto;
      margin-bottom: 14px;
      box-shadow: inset 0 0 30px rgba(255, 77, 125, 0.08);
    }

    .letter-container p {
      font-size: 14.8px;
      line-height: 1.76;
      color: #f3ecfc;
      margin-bottom: 14px;
    }

    .signoff {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }

    .footer-row {
      display: flex;
      gap: 10px;
    }
    .footer-row button {
      margin-top: 0;
      padding: 13px;
      font-size: 13.5px;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <canvas id="starsCanvas"></canvas>
  <canvas id="fxCanvas"></canvas>

  <div class="shell">
    <div class="card fade-enter" id="card"></div>
  </div>

  <script>
    /* ==========================================
       1. STARRY NIGHT SKY
       ========================================== */
    const starsCanvas = document.getElementById("starsCanvas");
    const sCtx = starsCanvas.getContext("2d");
    let stars = [];

    function initStars() {
      starsCanvas.width = window.innerWidth;
      starsCanvas.height = window.innerHeight;
      stars = Array.from({ length: 60 }, () => ({
        x: Math.random() * starsCanvas.width,
        y: Math.random() * starsCanvas.height,
        r: Math.random() * 1.5 + 0.4,
        alpha: Math.random(),
        speed: Math.random() * 0.014 + 0.004
      }));
    }

    function drawStars() {
      sCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0.15) s.speed = -s.speed;
        sCtx.beginPath();
        sCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        sCtx.fillStyle = `rgba(255, 232, 245, ${Math.abs(s.alpha)})`;
        sCtx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    window.addEventListener("resize", initStars);
    initStars();
    drawStars();

    /* ==========================================
       2. FLOATING HEARTS & CONFETTI
       ========================================== */
    const fxCanvas = document.getElementById("fxCanvas");
    const fCtx = fxCanvas.getContext("2d");
    let particles = [];
    let fxActive = false;

    function launchHearts() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
      const colors = ["#ff4d7d", "#f6c667", "#ff8fab", "#ffffff", "#e0aaff"];
      for (let i = 0; i < 85; i++) {
        particles.push({
          x: Math.random() * fxCanvas.width,
          y: Math.random() * fxCanvas.height - fxCanvas.height,
          vx: (Math.random() - 0.5) * 2.2,
          vy: Math.random() * 2.8 + 1.6,
          size: Math.random() * 7 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          isHeart: Math.random() > 0.4
        });
      }
      if (!fxActive) {
        fxActive = true;
        animateHearts();
      }
    }

    function drawHeartShape(ctx, x, y, size) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      ctx.moveTo(0, size / 4);
      ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, size / 4);
      ctx.bezierCurveTo(-size / 2, size / 2, 0, size * 0.75, 0, size);
      ctx.bezierCurveTo(0, size * 0.75, size / 2, size / 2, size / 2, size / 4);
      ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, size / 4);
      ctx.fill();
      ctx.restore();
    }

    function animateHearts() {
      fCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        fCtx.fillStyle = p.color;
        if (p.isHeart) {
          drawHeartShape(fCtx, p.x, p.y, p.size * 1.3);
        } else {
          fCtx.beginPath();
          fCtx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
          fCtx.fill();
        }
        if (p.y > fxCanvas.height + 20) particles.splice(idx, 1);
      });
      if (particles.length > 0) {
        requestAnimationFrame(animateHearts);
      } else {
        fxActive = false;
        fCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      }
    }

    /* ==========================================
       3. STORYBOOK ENGINE & FACIAL EXPRESSIONS
       ========================================== */
    const card = document.getElementById("card");
    const totalPages = 8;
    let page = 0;

    function setMood(emoji, label) {
      const av = document.getElementById("emojiAvatar");
      const cap = document.getElementById("moodCaption");
      if (av && cap) {
        av.classList.remove("emoji-pop");
        void av.offsetWidth;
        av.innerText = emoji;
        cap.innerText = label;
        av.classList.add("emoji-pop");
      }
    }

    function renderTop(emoji, moodLabel) {
      let dots = `<div class="dots-bar">`;
      for (let i = 0; i < totalPages; i++) {
        const cls = i === page ? "dot active" : i < page ? "dot done" : "dot";
        dots += `<span class="${cls}"></span>`;
      }
      dots += `</div>`;

      return `
        ${dots}
        <div class="mood-stage">
          <div class="emoji-avatar emoji-pop" id="emojiAvatar">${emoji}</div>
          <span class="mood-caption" id="moodCaption">${moodLabel}</span>
        </div>
      `;
    }

    function nextPage() {
      page++;
      card.classList.remove("fade-enter");
      void card.offsetWidth;
      card.classList.add("fade-enter");
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderPage();
    }

    function renderPage() {
      // PAGE 0: 12:00 AM INTRO
      if (page === 0) {
        card.innerHTML = `
          ${renderTop("😌", "12:00 AM • Just Us")}
          <h1>Hey Bubu… it’s finally midnight. ✨</h1>
          <div class="story-text">
            <p>Happy Birthday, Baby. ❤️</p>
            <p>Instead of just sending you a normal text tonight, I wanted to sit down with you for five minutes and walk through the story of how we actually got here.</p>
            <p>No tests, no quizzes—just our favorite memories, the funny chaos only we know about, and everything you mean to me. Tap below whenever you're ready.</p>
          </div>
          <button class="next-btn" id="next0">Open Page 1 🤍</button>
        `;
        document.getElementById("next0").onclick = nextPage;
      }

      // PAGE 1: OFFICE COLLEAGUES TO 13-HOUR MARATHONS
      else if (page === 1) {
        card.innerHTML = `
          ${renderTop("🤫", "Two 'Normal' Colleagues")}
          <h1>The 13-Hour Text & Ludo Era</h1>
          <div class="story-text">
            <p>Think back to 2024 at the Amex office. Back then, we were just colleagues walking past desks without a single clue of what was waiting ahead.</p>
            <p>And then late 2025 happened. Suddenly, our nights turned into <strong>13-hour nonstop text marathons</strong>, hours-long voice calls, and way too competitive online Ludo matches—only to show up at the office the next morning trying to keep a completely straight, professional face. 😐</p>
          </div>
          <div class="reaction-group">
            <button class="react-btn" id="r1_a">
              <span>"Our daytime acting in office was terrible tbh"</span>
              <span>🤭</span>
            </button>
            <button class="react-btn" id="r1_b">
              <span>"Those Ludo nights & 13-hour chats though..."</span>
              <span>🥹</span>
            </button>
          </div>
          <div class="whisper-box" id="w1"></div>
          <div id="nav1"></div>
        `;

        const showReply1 = (emoji, label, msg, btn) => {
          document.querySelectorAll(".react-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          setMood(emoji, label);
          const w = document.getElementById("w1");
          w.style.display = "block";
          w.innerHTML = msg;
          if (!document.getElementById("n1")) {
            const b = document.createElement("button");
            b.id = "n1";
            b.className = "next-btn";
            b.innerText = "Turn the page →";
            b.onclick = nextPage;
            document.getElementById("nav1").appendChild(b);
          }
        };

        document.getElementById("r1_a").onclick = function() {
          showReply1("🤭", "Zero Poker Face", "Honestly, we thought we were being so slick walking around like normal coworkers, while running on 3 hours of sleep because we couldn't stop talking all night.", this);
        };
        document.getElementById("r1_b").onclick = function() {
          showReply1("🥹", "Where It All Started", "Looking back, those late nights where neither of us wanted to hang up the call were the exact moment my routine started revolving around you.", this);
        };
      }

      // PAGE 2: ELAN MALL CRICKET SCREENING & VISHAL RANA
      else if (page === 2) {
        card.innerHTML = `
          ${renderTop("😎", "What Could Go Wrong?")}
          <h1>The Elan Mall Mini-Heart Attack</h1>
          <div class="story-text">
            <p>Speaking of trying to keep our lives low-key from office people… remember the day we went to <strong>Elan Mall</strong> to watch the cricket match on the big theatre screen?</p>
            <p>We stepped outside casually, minding our own business, and suddenly—<em>BOOM</em>. Right in front of us stands our common colleague, <strong>Vishal Rana</strong>. 😳</p>
          </div>
          <div class="reaction-group">
            <button class="react-btn" id="r2_a">
              <span>Tap to relive the sheer panic on our faces</span>
              <span>😱</span>
            </button>
          </div>
          <div class="whisper-box gold" id="w2"></div>
          <div id="nav2"></div>
        `;

        document.getElementById("r2_a").onclick = function() {
          this.classList.add("selected");
          setMood("😰", "Soul Left The Body 💀");
          const w = document.getElementById("w2");
          w.style.display = "block";
          w.innerHTML = `
            That silence was SO awkward for us and for him! Both of us literally froze thinking, <em>"Bas, aaj toh gaye—everyone is going to know now."</em> 😂<br><br>
            Shoutout to Vishal though—man turned out to be a total vault and didn't tell a single soul. Looking back now, even getting caught like that with you is one of my favorite funny memories. 😌
          `;
          setTimeout(() => setMood("😮‍💨", "Secret Safe With Vishal"), 1800);

          if (!document.getElementById("n2")) {
            const b = document.createElement("button");
            b.id = "n2";
            b.className = "next-btn";
            b.innerText = "Keep reading →";
            b.onclick = nextPage;
            document.getElementById("nav2").appendChild(b);
          }
        };
      }

      // PAGE 3: CYBER HUB, SECTOR 14/17 & LAST NOVEMBER
      else if (page === 3) {
        card.innerHTML = `
          ${renderTop("🥰", "Our Gurgaon Corners")}
          <h1>Cyber Hub, Sector 17 & Last November</h1>
          <div class="story-text">
            <p>From that breakthrough first proper date at <strong>Cyber Hub</strong>, our whole world in Gurgaon slowly became about one thing: just finding an excuse to see each other after work.</p>
            <p>Tap on each little memory below:</p>
          </div>
          <div class="moment-list">
            <div class="moment-item" id="m1">
              <div class="moment-head">
                <span>🍟 Sector 14 & Sector 17 Food Runs</span>
                <span>Tap ✨</span>
              </div>
              <div class="moment-body">
                McDonald's runs, pizzas, pastas, and spontaneous evening plans where the place didn't even matter—as long as I got to sit across from you.
              </div>
            </div>
            <div class="moment-item" id="m2">
              <div class="moment-head">
                <span>🌹 November 19 Last Year (Sector 17)</span>
                <span>Tap ✨</span>
              </div>
              <div class="moment-body">
                Coordinating that "Timeless Love" rose bouquet, chocolate cake, and star topper to your place in Sector 17 when we were just starting out—and now here we are, a whole year deeper.
              </div>
            </div>
          </div>
          <div id="nav3"></div>
        `;

        let opened = 0;
        const clicked = { m1: false, m2: false };
        ["m1", "m2"].forEach(id => {
          document.getElementById(id).onclick = function() {
            this.classList.add("opened");
            if (!clicked[id]) {
              clicked[id] = true;
              opened++;
              setMood(id === "m1" ? "🍕" : "🥺", id === "m1" ? "Food Partners For Life" : "One Year Of Birthdays");
              if (opened === 2 && !document.getElementById("n3")) {
                const b = document.createElement("button");
                b.id = "n3";
                b.className = "next-btn";
                b.innerText = "Turn the page →";
                b.onclick = nextPage;
                document.getElementById("nav3").appendChild(b);
              }
            }
          };
        });
      }

      // PAGE 4: THE MOVIE CURSE & DESSERT RIVALRY
      else if (page === 4) {
        card.innerHTML = `
          ${renderTop("🤨", "Unfinished Business")}
          <h1>4 Bad Movies & The Pancake Debate</h1>
          <div class="story-text">
            <p>Two things about us still crack me up every time I think about them.</p>
            <p>First: Our <strong>legendary movie curse</strong>. We have tried watching 3 or 4 movies together and haven't finished a single one—mostly because the movies were awful, and partly because talking to you is always way more entertaining than the screen. 🍿</p>
            <p>Second: Our never-ending war between <strong>your Waffles</strong> and <strong>my KitKat Pancakes</strong>.</p>
          </div>
          <div class="reaction-group">
            <button class="react-btn" id="r4_waffle">
              <span>"It's my birthday, admit Waffles are better 🧇"</span>
              <span>😤</span>
            </button>
            <button class="react-btn" id="r4_pancake">
              <span>"Fine, KitKat Pancakes win tonight 🥞"</span>
              <span>😌</span>
            </button>
          </div>
          <div class="whisper-box" id="w4"></div>
          <div id="nav4"></div>
        `;

        const show4 = (emoji, label, text, btn) => {
          document.querySelectorAll(".react-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          setMood(emoji, label);
          const w = document.getElementById("w4");
          w.style.display = "block";
          w.innerHTML = text;
          if (!document.getElementById("n4")) {
            const b = document.createElement("button");
            b.id = "n4";
            b.className = "next-btn";
            b.innerText = "Keep reading →";
            b.onclick = nextPage;
            document.getElementById("nav4").appendChild(b);
          }
        };

        document.getElementById("r4_waffle").onclick = function() {
          show4("🙄", "Birthday Privilege Granted", "Look at you using the birthday card at 12 AM! 😂 Okay fine, for the next 24 hours, Waffles take the crown. Tomorrow we go back to debating.", this);
        };
        document.getElementById("r4_pancake").onclick = function() {
          show4("🥳", "Miracles Do Happen", "Screenshot taken! 😂 Jokes aside, I'd happily order both with you any night of the week.", this);
        };
      }

      // PAGE 5: WHEN WE CLASH & MELT BACK TOGETHER
      else if (page === 5) {
        card.innerHTML = `
          ${renderTop("😤", "Two Stubborn Heads")}
          <h1>Our Stubborn Silences (That Never Last)</h1>
          <div class="story-text">
            <p>You know what actually makes me love us even more? We aren't some scripted, fake couple pretending everything is smooth 24/7.</p>
            <p>We have our moments where both of our tempers flare up, pride gets in the way, and we both sit there with folded arms acting like we’re never going to speak again. 😒</p>
          </div>
          <div class="reaction-group">
            <button class="react-btn" id="r5_melt">
              <span>Tap to see what happens 10 minutes later...</span>
              <span>🥺</span>
            </button>
          </div>
          <div class="whisper-box gold" id="w5"></div>
          <div id="nav5"></div>
        `;

        document.getElementById("r5_melt").onclick = function() {
          this.classList.add("selected");
          setMood("🫠", "Zero Ability To Stay Mad");
          const w = document.getElementById("w5");
          w.style.display = "block";
          w.innerHTML = `
            Neither of us can actually stay away. Within minutes, the wall drops, we sit down, talk it through properly, understand each other a little deeper than before, and go right back to teasing each other.<br><br>
            Even when I want to annoy you, you're still the exact same person I want to run back to immediately. ❤️
          `;
          if (!document.getElementById("n5")) {
            const b = document.createElement("button");
            b.id = "n5";
            b.className = "next-btn";
            b.innerText = "Turn the page →";
            b.onclick = nextPage;
            document.getElementById("nav5").appendChild(b);
          }
        };
      }

      // PAGE 6: KURUKSHETRA-KARNAL BUS, BADMINTON & VALENTINE'S
      else if (page === 6) {
        card.innerHTML = `
          ${renderTop("🥹", "My Everyday Comfort")}
          <h1>Highway Buses & Quiet Milestones</h1>
          <div class="story-text">
            <p>Whether it was taking that bus ride together out of Gurgaon toward <strong>Kurukshetra and Karnal</strong>, setting up decorations and drinks at your place on Valentine's, or settling ₹300 badminton Splitwise tabs—our lives quietly wove together.</p>
            <p>And that letter you wrote for me on Valentine's Day? I never told you enough how much those words stayed with me. Knowing how deeply we chose each other changed everything for me.</p>
          </div>
          <button class="next-btn" id="n6">Read Your Birthday Letter 💌</button>
        `;
        document.getElementById("n6").onclick = () => {
          launchHearts();
          nextPage();
        };
      }

      // PAGE 7: FINAL BIRTHDAY LETTER
      else if (page === 7) {
        card.innerHTML = `
          ${renderTop("🥰", "Happy Birthday, Bubu ❤️")}
          <h1>To My Favorite Person</h1>
          <div class="letter-container">
            <p><strong>Happy Birthday, Bubu. ❤️</strong></p>
            <p>Looking at where we started—from pretending to be strangers at Amex, to getting jump-scared by Vishal Rana outside the Elan Mall theatre, to late-night Ludo and Cyber Hub dates—it still amazes me how naturally you became the center of my days.</p>
            <p>You aren't just my girlfriend; you're my favorite habit. You're the face I scan every room for, the first person I want to tell random updates to, and the comfort I look forward to at the end of every chaotic workday.</p>
            <p>Thank you for every warm hug, every little <em>"take care,"</em> every time you stayed by my side, every dramatic moment we laughed off, and every late-evening craving we turned into an adventure.</p>
            <p>I don't just love the past year we've built—I'm excited for everything waiting ahead of us. More highway trips, more birthdays at midnight, more terrible movies we never finish, more Waffles and KitKat Pancakes, and walking through every season of life right beside you.</p>
            <p><strong>I love you so much, Dhairya. Happy Birthday, Baby. 🫶🏻✨</strong></p>
            <div class="signoff">
              Forever yours,<br>Mannu ❤️
            </div>
          </div>
          <div class="footer-row">
            <button class="next-btn" id="moreHeartsBtn">💖 Shower Hearts</button>
            <button class="react-btn" id="restartBtn" style="justify-content:center;">🔄 Read Again</button>
          </div>
        `;

        document.getElementById("moreHeartsBtn").onclick = launchHearts;
        document.getElementById("restartBtn").onclick = () => {
          page = 0;
          renderPage();
        };
      }
    }

    renderPage();
  </script>
</body>
</html>
